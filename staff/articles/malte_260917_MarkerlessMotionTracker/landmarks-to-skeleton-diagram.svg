<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="560" fill="#000000"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">From Landmarks to a Moving Skeleton</text>

  <!-- Stage 1 -->
  <rect x="30" y="90" width="255" height="150" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="157" y="140" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">MediaPipe</text>
  <text x="157" y="165" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Landmarks</text>
  <text x="157" y="196" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">Raw joint positions,</text>
  <text x="157" y="214" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">per frame — noisy,</text>
  <text x="157" y="232" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">no rotation data</text>

  <line x1="285" y1="165" x2="320" y2="165" stroke="#ffffff" stroke-width="2"/>
  <polygon points="320,158 336,165 320,172" fill="#ffffff"/>

  <!-- Stage 2 -->
  <rect x="336" y="90" width="255" height="150" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="463" y="140" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Temporal</text>
  <text x="463" y="165" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Smoothing</text>
  <text x="463" y="196" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">Quaternion interpolation</text>
  <text x="463" y="214" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">across frames — not raw</text>
  <text x="463" y="232" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">position averaging</text>

  <line x1="591" y1="165" x2="626" y2="165" stroke="#ffffff" stroke-width="2"/>
  <polygon points="626,158 642,165 626,172" fill="#ffffff"/>

  <!-- Stage 3 -->
  <rect x="642" y="90" width="255" height="150" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="769" y="140" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Bind-Pose</text>
  <text x="769" y="165" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Retargeting</text>
  <text x="769" y="196" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">Swing-from-rest, solved</text>
  <text x="769" y="214" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">entirely in engine component</text>
  <text x="769" y="232" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">space — no lookup table</text>

  <line x1="897" y1="165" x2="932" y2="165" stroke="#ffffff" stroke-width="2"/>
  <polygon points="932,158 948,165 932,172" fill="#ffffff"/>

  <!-- Stage 4 -->
  <rect x="948" y="90" width="222" height="150" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="1059" y="140" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Rig-Ready</text>
  <text x="1059" y="165" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Helvetica, Arial, sans-serif">Rotations</text>
  <text x="1059" y="196" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">Streamed live via a</text>
  <text x="1059" y="214" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">custom OSC → LiveLink</text>
  <text x="1059" y="232" text-anchor="middle" fill="#bbbbbb" font-size="13" font-family="Helvetica, Arial, sans-serif">source into UE5</text>

  <!-- Annotation -->
  <line x1="910" y1="340" x2="910" y2="245" stroke="#e2723a" stroke-width="2"/>
  <polygon points="902,257 910,240 918,257" fill="#e2723a"/>
  <rect x="660" y="340" width="500" height="120" fill="#e2723a"/>
  <text x="910" y="375" text-anchor="middle" fill="#000000" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Known limitation</text>
  <text x="910" y="400" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">Twist around a bone's own axis (e.g. forearm</text>
  <text x="910" y="418" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">pronation) can't be recovered from landmark</text>
  <text x="910" y="436" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">positions alone — it stays undetermined.</text>
</svg>
