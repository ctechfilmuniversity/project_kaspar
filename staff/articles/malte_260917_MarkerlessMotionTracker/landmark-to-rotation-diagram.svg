<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="780" fill="#000000"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold">How a Landmark Position Becomes a Bone Rotation</text>
  <text x="600" y="68" text-anchor="middle" fill="#999999" font-family="Helvetica, Arial, sans-serif" font-size="14">Swing falls out of two points every frame — twist never does</text>

  <!-- Left panel: rest pose -->
  <rect x="50" y="100" width="480" height="350" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="290" y="130" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1 · Rest Pose — known from the rig</text>

  <circle cx="290" cy="180" r="7" fill="#ffffff"/>
  <text x="200" y="175" text-anchor="end" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">Shoulder (parent joint)</text>

  <circle cx="290" cy="380" r="7" fill="#ffffff"/>
  <text x="200" y="385" text-anchor="end" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">Elbow (child joint)</text>

  <line x1="290" y1="180" x2="290" y2="373" stroke="#ffffff" stroke-width="4"/>
  <polygon points="283,373 290,388 297,373" fill="#ffffff"/>
  <text x="310" y="285" text-anchor="start" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">rest direction</text>
  <text x="310" y="300" text-anchor="start" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">(bind pose)</text>

  <!-- Arrow between panels -->
  <line x1="535" y1="270" x2="655" y2="270" stroke="#ffffff" stroke-width="2"/>
  <polygon points="655,263 670,270 655,277" fill="#ffffff"/>
  <text x="600" y="250" text-anchor="middle" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">swing rotation =</text>
  <text x="600" y="296" text-anchor="middle" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">rotate rest → observed</text>

  <!-- Right panel: tracked pose -->
  <rect x="670" y="100" width="480" height="350" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="910" y="130" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2 · Tracked Pose — from two live points</text>

  <circle cx="860" cy="170" r="8" fill="#e2723a"/>
  <text x="780" y="160" text-anchor="end" fill="#e2723a" font-size="12" font-family="Helvetica, Arial, sans-serif">MediaPipe landmark</text>
  <text x="780" y="175" text-anchor="end" fill="#e2723a" font-size="12" font-family="Helvetica, Arial, sans-serif">(shoulder, this frame)</text>

  <circle cx="1020" cy="380" r="8" fill="#e2723a"/>
  <text x="1040" y="375" text-anchor="start" fill="#e2723a" font-size="12" font-family="Helvetica, Arial, sans-serif">MediaPipe landmark</text>
  <text x="1040" y="390" text-anchor="start" fill="#e2723a" font-size="12" font-family="Helvetica, Arial, sans-serif">(elbow, this frame)</text>

  <line x1="860" y1="170" x2="860" y2="380" stroke="#777777" stroke-width="2" stroke-dasharray="5,5"/>

  <line x1="860" y1="170" x2="1013" y2="374" stroke="#ffffff" stroke-width="4"/>
  <polygon points="1002,367 1020,380 1000,384" fill="#ffffff"/>
  <text x="960" y="330" text-anchor="start" fill="#bbbbbb" font-size="12" font-family="Helvetica, Arial, sans-serif">observed direction</text>

  <path d="M 860 205 A 35 35 0 0 1 881 198" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="896" y="208" text-anchor="start" fill="#ffffff" font-size="16" font-family="Helvetica, Arial, sans-serif">&#952;</text>

  <!-- Bottom: twist ambiguity -->
  <text x="600" y="500" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3 · What Two Points Can't Tell You: Twist</text>

  <circle cx="445" cy="595" r="9" fill="#ffffff"/>
  <circle cx="755" cy="595" r="9" fill="#ffffff"/>
  <rect x="430" y="580" width="340" height="30" rx="15" fill="none" stroke="#ffffff" stroke-width="2"/>

  <ellipse cx="600" cy="558" rx="62" ry="18" fill="none" stroke="#e2723a" stroke-width="2"/>
  <polygon points="654,552 668,558 652,566" fill="#e2723a"/>
  <text x="600" y="548" text-anchor="middle" fill="#e2723a" font-size="20" font-weight="bold" font-family="Helvetica, Arial, sans-serif">?</text>

  <rect x="280" y="645" width="640" height="105" fill="#e2723a"/>
  <text x="600" y="670" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Twist is like a pencil:</text>
  <text x="600" y="692" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">you can point it anywhere in space, and still spin it between your</text>
  <text x="600" y="710" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">fingers without changing where it points. That's why forearm pronation</text>
  <text x="600" y="728" text-anchor="middle" fill="#000000" font-size="13" font-family="Helvetica, Arial, sans-serif">can't be recovered from landmark positions alone.</text>
</svg>
